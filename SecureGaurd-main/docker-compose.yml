# SecureGuard — on-prem package (Day 10)
#
# Runs the whole product with Docker Compose: Postgres + FP classifier +
# Node backend + Nginx frontend. No hosted service is needed except the
# optional ones (Brevo mail, Gemini AI fix) — see docs/ON_PREM.md.
#
# Verification status (stated honestly): this file, the Dockerfiles and the
# install doc were statically verified only (YAML parse + path checks).
# This VM has no Docker, so no runtime smoke test was run here — the
# smoke-test steps in docs/ON_PREM.md are the first-run checklist for a
# Docker host (e.g. Rishabh's laptop).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: secureguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: secureguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureguard -d secureguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  classifier:
    build:
      context: ./backend
      dockerfile: ./services/fp-classifier/Dockerfile
    restart: unless-stopped
    environment:
      CLASSIFIER_API_KEY: ${CLASSIFIER_API_KEY:?Set CLASSIFIER_API_KEY in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      classifier:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgresql://secureguard:${POSTGRES_PASSWORD}@db:5432/secureguard?schema=public
      FP_CLASSIFIER_URL: http://classifier:8001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SCAN_CLONE_DIR: /tmp/scan-clones
    # Mirrors Render's preDeployCommand: apply Prisma migrations before the
    # new code serves traffic. A failed migration keeps the container from
    # starting (same fail-closed behaviour as the hosted deploy).
    command: ["sh", "-c", "npx prisma migrate deploy --schema prisma/schema.prisma && node server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
