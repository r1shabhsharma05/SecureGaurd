services:
  - type: web
    name: secureguard-api
    runtime: node
    rootDir: SecureGaurd-main/backend
    buildCommand: npm install && npm run build
    # Apply pending Prisma migrations (e.g. the refresh-token grace-window
    # columns) before the new code goes live. Idempotent; a failure keeps the
    # previous deploy running instead of shipping code against a stale schema.
    preDeployCommand: npx prisma migrate deploy --schema prisma/schema.prisma
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLASSIFIER_API_KEY
        sync: false
      # Optional integrations — declared here (names only, values stay in
      # the Render dashboard) so the blueprint documents the full
      # production inventory from backend/.env.example. Day 4: previously
      # missing, so a blueprint re-sync would not have listed them.
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: FP_CLASSIFIER_URL
        sync: false
      # Queue + cache: provision a Redis (Render Key Value or Upstash) and
      # paste its URL here. Until then the API still works — scans run on
      # an in-process queue and the cache is bypassed (see docs/SCAN_QUEUE_CACHE_LOADTEST.md).
      - key: REDIS_URL
        sync: false
      - key: SCAN_WORKER_CONCURRENCY
        sync: false
      - key: GEMINI_WEB2API_URL
        sync: false
      - key: GEMINI_WEB2API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITLAB_CLIENT_ID
        sync: false
      - key: GITLAB_CLIENT_SECRET
        sync: false
      - key: BACKEND_URL
        sync: false