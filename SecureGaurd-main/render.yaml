services:
  - type: web
    name: secureguard-api
    runtime: node
    rootDir: SecureGaurd-main/backend
    buildCommand: npm install && npm run build
    # Apply pending Prisma migrations (e.g. the refresh-token grace-window
    # columns) before the new code goes live. Idempotent; a failure keeps the
    # previous deploy running instead of shipping code against a stale schema.
    preDeployCommand: npx prisma migrate deploy --schema prisma/schema.prisma
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLASSIFIER_API_KEY
        sync: false