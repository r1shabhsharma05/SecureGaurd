<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecureGuard — AI-Powered Code Security Platform</title>
    <meta name="description" content="SecureGuard scans your codebase in real-time with AI to detect vulnerabilities, secrets, and misconfigurations before they reach production." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://secureguard-main.vercel.app/" />
    <!-- Favicon set (Day 8): SVG + PNG sizes + ICO + Apple touch icon + manifest. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Open Graph / Twitter sharing (custom OG image, Day 8). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SecureGuard" />
    <meta property="og:title" content="SecureGuard — AI-Powered Code Security" />
    <meta property="og:description" content="Shift security left. Detect threats before they reach production." />
    <meta property="og:url" content="https://secureguard-main.vercel.app/" />
    <meta property="og:image" content="https://secureguard-main.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SecureGuard — AI-powered code security" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SecureGuard — AI-Powered Code Security" />
    <meta name="twitter:description" content="Shift security left. Detect threats before they reach production." />
    <meta name="twitter:image" content="https://secureguard-main.vercel.app/og-image.png" />
    <meta name="theme-color" content="#0B0F19" />
    <!-- Faster font loading (Day 8): preconnect + display=swap stylesheet
         replaces the render-blocking @import that lived in index.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Schema.org structured data (Day 8). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "SecureGuard",
        "applicationCategory": "SecurityApplication",
        "operatingSystem": "Web",
        "description": "AI-powered code security platform: SAST, secret detection, software composition analysis and AI fixes.",
        "url": "https://secureguard-main.vercel.app/",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" },
        "publisher": { "@type": "Organization", "name": "SecureGuard", "url": "https://secureguard-main.vercel.app/" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
