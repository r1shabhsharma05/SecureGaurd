# Secret scan — preventive control for the JWT-secret-in-history finding
# (a real JWT_SECRET was committed to pushed history at e1e3dc9).
# Blocks any future .env / credential commit from landing via PR or push
# to main. Runs gitleaks over the full history (fetch-depth: 0).
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is required only for organization-owned repos;
          # this is a personal-account repo, so no license secret is needed.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
